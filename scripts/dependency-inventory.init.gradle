import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    app.tasks.register('releaseDependencyInventory') {
        doLast {
            def modules = app.configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents
                .collect { it.id }.findAll { it instanceof ModuleComponentIdentifier }
                .collect { component -> [group: component.group, name: component.module, version: component.version] }
                .sort { a, b -> "${a.group}:${a.name}:${a.version}" <=> "${b.group}:${b.name}:${b.version}" }
            def destination = new File(gradle.rootProject.projectDir, 'outputs/release-dependencies.json')
            destination.parentFile.mkdirs()
            destination.text = JsonOutput.prettyPrint(JsonOutput.toJson(modules)) + '\n'
            println "Recorded ${modules.size()} resolved release modules (including platforms): ${destination}"
        }
    }
}
